name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Stats Cards
        run: |
          mkdir -p assets
          curl -s "https://github-readme-stats.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320" > assets/stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6" > assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Update GitHub stats" || exit 0
          git push