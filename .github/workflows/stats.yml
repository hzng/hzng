name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Stats Cards
        run: |
          set -euo pipefail
          mkdir -p assets
          
          download_with_retry() {
            local url=$1
            local output=$2
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt/$max_attempts: Downloading $output..."
              if curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 60 "$url" -o "$output"; then
                if [ -s "$output" ]; then
                  echo "Successfully downloaded $output ($(wc -c < "$output") bytes)"
                  return 0
                else
                  echo "Downloaded file is empty"
                fi
              else
                echo "curl failed with exit code $?"
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 15s..."
                sleep 15
              fi
              attempt=$((attempt + 1))
            done
            echo "Failed to download $output after $max_attempts attempts"
            return 1
          }
          
          echo "=== Downloading stats.svg ==="
          download_with_retry "https://github-readme-stats.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320" assets/stats.svg
          
          echo "=== Downloading top-langs.svg ==="
          download_with_retry "https://github-readme-stats.vercel.app/api/top-langs/?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6" assets/top-langs.svg
          
          echo "=== Verifying files ==="
          ls -la assets/
          file assets/stats.svg
          file assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi