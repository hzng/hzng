name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Stats Cards
        run: |
          set -euo pipefail
          mkdir -p assets
          
          # Try multiple services in order
          download_with_multiple_fallbacks() {
            local output=$1
            shift
            local urls=("$@")
            
            for url in "${urls[@]}"; do
              echo "Trying: $url"
              if curl -fL --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 60 "$url" -o "$output"; then
                if [ -s "$output" ]; then
                  echo "Success ($(wc -c < "$output") bytes): $url"
                  return 0
                else
                  echo "Empty file from: $url"
                fi
              else
                echo "Failed: $url (exit code $?)"
              fi
            done
            echo "All URLs failed for $output"
            return 1
          }
          
          STATS_URLS=(
            "https://github-readme-stats.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320"
            "https://github-readme-stats-sigma.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320"
            "https://github-readme-stats-eight.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320"
            "https://gh-stats.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320"
          )
          
          LANGS_URLS=(
            "https://github-readme-stats.vercel.app/api/top-langs/?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6"
            "https://github-readme-stats-sigma.vercel.app/api/top-langs?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6"
            "https://github-readme-stats-eight.vercel.app/api/top-langs?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6"
            "https://gh-stats.vercel.app/api/top-langs?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6"
          )
          
          echo "=== Downloading stats.svg ==="
          download_with_multiple_fallbacks assets/stats.svg "${STATS_URLS[@]}"
          
          echo "=== Downloading top-langs.svg ==="
          download_with_multiple_fallbacks assets/top-langs.svg "${LANGS_URLS[@]}"
          
          echo "=== Verifying files ==="
          ls -la assets/
          file assets/stats.svg
          file assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi