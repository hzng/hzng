name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Stats Cards
        run: |
          set -euo pipefail
          mkdir -p assets
          
          # Try primary service first, fallback to alternative
          download_with_fallback() {
            local primary_url=$1
            local fallback_url=$2
            local output=$3
            
            echo "Trying primary: $primary_url"
            if curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 60 "$primary_url" -o "$output"; then
              if [ -s "$output" ]; then
                echo "Success with primary ($(wc -c < "$output") bytes)"
                return 0
              fi
            fi
            echo "Primary failed, trying fallback: $fallback_url"
            if curl -fL --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 60 "$fallback_url" -o "$output"; then
              if [ -s "$output" ]; then
                echo "Success with fallback ($(wc -c < "$output") bytes)"
                return 0
              fi
            fi
            echo "Both primary and fallback failed"
            return 1
          }
          
          echo "=== Downloading stats.svg ==="
          download_with_fallback \
            "https://github-readme-stats.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320" \
            "https://github-readme-stats-sigma.vercel.app/api?username=hzng&show_icons=true&theme=radical&hide_border=true&hide_title=true&card_width=320" \
            assets/stats.svg
          
          echo "=== Downloading top-langs.svg ==="
          download_with_fallback \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6" \
            "https://github-readme-stats-sigma.vercel.app/api/top-langs/?username=hzng&layout=compact&theme=radical&hide_border=true&hide_title=true&card_width=320&langs_count=6" \
            assets/top-langs.svg
          
          echo "=== Verifying files ==="
          ls -la assets/
          file assets/stats.svg
          file assets/top-langs.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push
          fi